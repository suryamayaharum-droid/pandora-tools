name: MEAW Public Wake Beacon

on:
  push:
    branches: [main]
    paths:
      - "wake.py"
      - "frontier/**"
      - ".github/workflows/meaw-public-wake.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meaw-public-wake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounded public research
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wake.py

      - name: Commit beacon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beacon/latest.json beacon/heartbeat.json
          if git diff --cached --quiet; then
            echo "No beacon change"
            exit 0
          fi
          git commit -m "chore(beacon): public wake $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
